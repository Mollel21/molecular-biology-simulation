    // ============================================================

    function loadReport() {

        console.log('📄 Loading enhanced report for:', experimentId);

        // Try to get saved results from localStorage

        let isFromStorage = false;

            'dna-extraction': ['dnaExtractionResults', 'dna-extractionResults'],
            'gel-electrophoresis': ['gelElectrophoresisResults', 'gel-electrophoresisResults'],
            'bacterial-pcr': ['bacterialPcrResults', 'bacterial-pcrResults'],
            'fungal-pcr': ['fungalPcrResults', 'fungal-pcrResults']
        };

        const possibleKeys = keyMap[experimentId] || [experimentId + 'Results'];

        try {
            for (let key of possibleKeys) {
                const stored = localStorage.getItem(key);
                if (stored) {
                    savedData = JSON.parse(stored);
                    isFromStorage = true;
                    console.log('📦 Found saved results with key:', key);
                    break;
                }
            }
        } catch (e) {
            console.warn('Could not read from localStorage:', e);
        }

        // Get base data from experimentData

        // Merge saved data with base data if available

        if (savedData) {
            // Merge saved data into the report

            badge.className = 'badge saved';

                <p style="margin-top: 2px;">${data.institution || courseInfo.institution} • ${data.department || courseInfo.department}</p>

        container.innerHTML = html;
    }

    // ============================================================
    // CLEAR AND RELOAD
    // ============================================================
    function clearAndReload() {
        if (confirm('Are you sure you want to clear all saved data and reload the report?')) {
            try {
                const urlParams = new URLSearchParams(window.location.search);
                const experimentId = urlParams.get('id') || 'gel-electrophoresis';

                const keyMap = {
                    'dna-extraction': ['dnaExtractionResults', 'dna-extractionResults'],
                    'gel-electrophoresis': ['gelElectrophoresisResults', 'gel-electrophoresisResults'],
                    'bacterial-pcr': ['bacterialPcrResults', 'bacterial-pcrResults'],
                    'fungal-pcr': ['fungalPcrResults', 'fungal-pcrResults']
                };

                const keys = keyMap[experimentId] || [experimentId + 'Results'];
                keys.forEach(key => localStorage.removeItem(key));

                alert('✅ Data cleared successfully! Reloading...');
                location.reload();
            } catch (e) {
                alert('Error clearing data: ' + e.message);
            }
        }
    }

    // ============================================================
    // INITIALIZE
    // ============================================================
    document.addEventListener('DOMContentLoaded', loadReport);

    // Expose functions globally
    window.loadReport = loadReport;
    window.clearAndReload = clearAndReload;
</script>
